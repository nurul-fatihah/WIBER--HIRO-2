<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Hiro 3D Base</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro" smooth="true" smooth-count="5">
      <!-- Floating black 3D base -->
      <a-entity
        position="0 0.35 0"
        animation="property: position;
          from: 0 0.30 0;
          to: 0 0.42 0;
          dur: 1800;
          dir: alternate;
          loop: true;
          easing: easeInOutSine">

        <!-- Black rectangular base -->
        <a-box
          position="0 0 0"
          width="1.5"
          height="0.28"
          depth="0.35"
          color="#05080D"
          material="metalness: 0.25; roughness: 0.35">
        </a-box>

        <!-- Thin cyan line underneath -->
        <a-box
          position="0 -0.145 0"
          width="1.47"
          height="0.012"
          depth="0.32"
          color="#00EFFF"
          material="emissive: #00EFFF; emissiveIntensity: 1.5">
        </a-box>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
